name: A1 A1plus final gate

on:
  push:
    branches:
      - content/a1-a1plus-productiebank-v2-2026-09-21
  workflow_dispatch:

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHROME_PATH: /home/runner/.cache/ms-playwright/chromium-1234/chrome-linux64/chrome
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Matrix en taalregressies
        run: node tests/matrix.cjs
      - name: A1 A1plus vier vormen browser smoke
        run: node tests/a1-a1plus-v2-smoke.cjs
