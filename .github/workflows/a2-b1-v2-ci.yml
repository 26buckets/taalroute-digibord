name: A2 B1 v2 CI

on:
  push:
    branches:
      - content/a2-b1-productiebank-v2-2026-09-20
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full test suite
        env:
          CHROME_PATH: /home/runner/.cache/ms-playwright/chromium-*/chrome-linux/chrome
        run: npm test
