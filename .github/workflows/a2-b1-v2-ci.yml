name: A2 B1 v2 CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Set Chrome path
        run: echo "CHROME_PATH=$(node -e \"const {chromium}=require('playwright');process.stdout.write(chromium.executablePath())\")" >> "$GITHUB_ENV"

      - name: Run full test suite
        run: npm test

      - name: Run A2 B1 v2 browser smoke
        run: node tests/a2-b1-v2-smoke.cjs
