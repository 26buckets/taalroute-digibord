name: A2 B1 v2 CI

on:
  push:
    branches:
      - content/a2-b1-productiebank-v2-2026-09-20
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        half: [0, 1]
    env:
      CHROME_PATH: /home/runner/.cache/ms-playwright/chromium-1234/chrome-linux64/chrome
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Provide legacy Mac Chrome path
        run: |
          sudo mkdir -p "/Applications/Google Chrome.app/Contents/MacOS"
          sudo ln -sf "$CHROME_PATH" "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"

      - name: Run full test suite
        run: |
          node <<'JS'
          const {execSync} = require('node:child_process');
          const tests = require('./package.json').scripts.test.split(' && ');
          const half = Math.ceil(tests.length / 2);
          const start = ${{ matrix.half }} * half;
          for (const test of tests.slice(start, start + half)) {
            console.log('Running:', test);
            execSync(test, {stdio: 'inherit'});
          }
          JS

      - name: Run A2 B1 v2 browser smoke
        if: matrix.half == 1
        run: node tests/a2-b1-v2-smoke.cjs

      - name: Alle banken en routes in de browser
        if: matrix.half == 1
        run: node tests/banks-v2-smoke.cjs
